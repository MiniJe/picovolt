[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picovolt"
version = "1.7.0"
description = "Embedded SQL database with MVCC history and single-file deployment"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["database", "embedded", "sql", "storage-engine", "mvcc", "time-travel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Database Engines/Servers",
]

[project.urls]
Homepage = "https://github.com/MiniJe/picovolt"
Repository = "https://github.com/MiniJe/picovolt"
Documentation = "https://github.com/MiniJe/picovolt/tree/main/bindings/python"
Changelog = "https://github.com/MiniJe/picovolt/blob/main/CHANGELOG.md"
Issues = "https://github.com/MiniJe/picovolt/issues"

[tool.setuptools]
packages = ["picovolt"]

[tool.setuptools.package-data]
# When a prebuilt shared library is copied into the package before building, it
# is bundled into the (platform-specific) wheel.
picovolt = ["*.so", "*.dylib", "*.dll"]

# A source checkout still works without a bundled library: the wrapper falls back
# to PICOVOLT_LIB or the cargo build output (target/release). The platform wheel
# is produced by copying the compiled library into picovolt/ before the build;
# see setup.py and .github/workflows/python-wheels.yml.
