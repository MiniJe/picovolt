name: Release

# Fires only on an annotated semantic-version tag. A normal push to main never
# publishes. The tag must match the version in Cargo.toml.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Re-run the full quality gate and make sure the tag matches Cargo.toml.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME}"
          cargo_ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag  Cargo.toml=v$cargo_ver"
          if [ "$tag" != "v$cargo_ver" ]; then
            echo "::error::tag $tag does not match Cargo.toml version v$cargo_ver"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check
      - name: Registry-only starter policy
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check_registry_starters.py policy
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Build native C ABI for Go
        run: cargo build --locked --features capi
      - name: Test and vet the Go binding
        working-directory: bindings/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: |
          go test ./...
          go vet ./...
      - name: Extended crash/recovery soak
        env:
          PICOVOLT_CRASH_CYCLES: "1000"
        run: cargo test --locked --test crash_recovery randomized_cross_process_crashes_are_atomic
      - name: Doc tests
        run: cargo test --locked --doc
      - name: API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --all-features --no-deps
      - name: Build wasm32
        run: cargo build --locked --lib --target wasm32-unknown-unknown --release --features wasm
      - name: Audit
        run: cargo audit

  # 2. Publish to crates.io. A missing credential is a hard failure unless this
  # immutable version already exists (for example on a workflow rerun).
  publish-crate:
    name: publish (crates.io)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: cargo publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error --max-time 30 \
            --user-agent "picovolt-release-workflow/$version" \
            "https://crates.io/api/v1/crates/picovolt/$version" \
            --output crate-version.json 2>/dev/null; then
            jq -e --arg version "$version" \
              '.version.num == $version' crate-version.json >/dev/null
            echo "picovolt $version already exists on crates.io"
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for an unpublished version"
            exit 1
          fi
          cargo publish --locked --token "$TOKEN"

  # 3. Build the wasm package and publish to npm through the package's trusted
  # publisher. OIDC avoids storing a long-lived npm credential in GitHub.
  publish-npm:
    name: publish (npm)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build npm package
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/src/picovolt --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$rustup_home=/rustup"
          wasm-pack build --target bundler --release --out-dir pkg -- --locked --features wasm
      - name: Add the better-sqlite3-inspired adapter to the package
        run: |
          cp bindings/js/sqlite.js pkg/sqlite.js
          cp bindings/js/browser.js pkg/browser.js
          cp bindings/js/worker.js pkg/worker.js
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('pkg/package.json'));p.files=Array.from(new Set([...(p.files||[]),'sqlite.js','browser.js','worker.js']));p.exports={'.':'./'+(p.module||'picovolt.js'),'./sqlite':'./sqlite.js','./browser':'./browser.js','./worker':'./worker.js'};p.repository={type:'git',url:'git+https://github.com/MiniJe/picovolt.git'};fs.writeFileSync('pkg/package.json',JSON.stringify(p,null,2));"
      - name: Publish to npm with provenance
        working-directory: pkg
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if published="$(npm view "picovolt@$version" version \
            --registry=https://registry.npmjs.org --json 2>/dev/null)"; then
            node -e \
              'if (JSON.parse(process.argv[1]) !== process.argv[2]) process.exit(1)' \
              "$published" "$version"
            echo "picovolt $version already exists on npm"
            exit 0
          fi
          npm publish \
            --registry=https://registry.npmjs.org \
            --access public \
            --provenance

  registry-smoke:
    name: registry starters (Cargo + npm)
    needs: [publish-crate, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Copy, install, and run the published starters
        run: >-
          python scripts/check_registry_starters.py run
          --version "${GITHUB_REF_NAME#v}"
          --starter rust --starter node --starter browser

  # Python wheels run separately because they use a protected PyPI environment
  # and a platform build matrix. Wait for that exact tag workflow, which also
  # publishes and smoke-tests the Go submodule tag, before cutting a GitHub
  # Release. The job-level timeout bounds both discovery and completion waits.
  python-go-registry-gate:
    name: registry starters (PyPI + Go proxy)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the matching Python wheels workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 30); do
            runs="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow python-wheels.yml \
              --event push \
              --limit 50 \
              --json databaseId,headBranch,headSha)"
            run_id="$(jq -r \
              --arg sha "$GITHUB_SHA" \
              --arg tag "$GITHUB_REF_NAME" \
              '.[] | select(.headSha == $sha and .headBranch == $tag) | .databaseId' \
              <<<"$runs" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            echo "Python wheels workflow is not visible yet ($attempt/30)"
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::no Python wheels workflow found for $GITHUB_SHA"
            exit 1
          fi
          echo "waiting for Python wheels workflow run $run_id"
          gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 15

  # 4. Build native CLI/server downloads and C ABI bundles, produce a CycloneDX
  # SBOM, and attest their provenance on native GitHub-hosted runners.
  build-binaries:
    name: binaries (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            ext: ""
          - os: macos-latest
            label: macos-arm64
            ext: ""
          - os: windows-latest
            label: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-cyclonedx
      - name: Build CLI, server, and C ABI library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --features "server capi data-tools" \
            --lib --bin pv --bin picovolt-server
          "target/release/pv${{ matrix.ext }}" --help
          mkdir -p dist
          cp "target/release/pv${{ matrix.ext }}" "dist/pv-${{ matrix.label }}${{ matrix.ext }}"
          cp "target/release/picovolt-server${{ matrix.ext }}" "dist/picovolt-server-${{ matrix.label }}${{ matrix.ext }}"

          bundle="picovolt-capi-${{ matrix.label }}"
          mkdir -p "dist/$bundle/include" "dist/$bundle/lib"
          cp include/picovolt.h "dist/$bundle/include/"
          case "$RUNNER_OS" in
            Linux)
              cp target/release/libpicovolt.so "dist/$bundle/lib/"
              ;;
            macOS)
              cp target/release/libpicovolt.dylib "dist/$bundle/lib/"
              ;;
            Windows)
              cp target/release/picovolt.dll "dist/$bundle/lib/"
              for candidate in \
                target/release/picovolt.dll.lib \
                target/release/picovolt.dll.a \
                target/release/libpicovolt.dll.a; do
                if [ -f "$candidate" ]; then
                  cp "$candidate" "dist/$bundle/lib/"
                fi
              done
              ;;
            *)
              echo "::error::unsupported runner OS $RUNNER_OS"
              exit 1
              ;;
          esac
          tar -C dist -czf "dist/$bundle.tar.gz" "$bundle"
          rm -r "dist/$bundle"

          # cargo-cyclonedx appends the selected format extension even when the
          # filename is overridden, so omit the trailing `.json` here.
          cargo cyclonedx --all-features --format json --override-filename "picovolt-${{ matrix.label }}.cdx"
          test -f "picovolt-${{ matrix.label }}.cdx.json"
          mv "picovolt-${{ matrix.label }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # 5. Cut the GitHub Release with notes and all native artifacts.
  github-release:
    name: github release
    needs: [verify, build-binaries, registry-smoke, python-go-registry-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          start="## [${ver}]"
          # index()-based prefix match: a dynamic regex with \[ is mis-parsed by
          # gawk as a character class, so avoid regex for the version header.
          awk -v start="$start" '
            index($0, start)==1 {flag=1; next}
            flag && index($0, "## [")==1 {exit}
            flag && /^\[.*\]:/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section for $ver; will auto-generate notes."
          fi
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already exists; refreshing its verified assets"
            if [ -s RELEASE_NOTES.md ]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "PicoVolt $GITHUB_REF_NAME" \
                --notes-file RELEASE_NOTES.md
            else
              gh release edit "$GITHUB_REF_NAME" \
                --title "PicoVolt $GITHUB_REF_NAME"
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*
          elif [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "PicoVolt $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "PicoVolt $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
