name: Release

# Fires only on an annotated version tag (e.g. v0.1.0). A normal push to main
# never publishes. The tag must match the version in Cargo.toml.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1. Re-run the full quality gate and make sure the tag matches Cargo.toml.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit

      - name: Tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME}"
          cargo_ver="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag  Cargo.toml=v$cargo_ver"
          if [ "$tag" != "v$cargo_ver" ]; then
            echo "::error::tag $tag does not match Cargo.toml version v$cargo_ver"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Doc tests
        run: cargo test --doc
      - name: Build wasm32
        run: cargo build --lib --target wasm32-unknown-unknown --release --features wasm
      - name: Audit
        run: cargo audit

  # 2. Publish to crates.io, skipped automatically if the token secret is absent.
  publish-crate:
    name: publish (crates.io)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: cargo publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            exit 0
          fi
          # No --locked: Cargo.lock is intentionally not committed (library).
          cargo publish --token "$TOKEN"

  # 3. Build the wasm package and publish to npm. Configure this workflow as the
  # package's trusted publisher; NPM_TOKEN remains a temporary fallback.
  publish-npm:
    name: publish (npm)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build npm package
        run: wasm-pack build --target bundler --release --out-dir pkg -- --features wasm
      - name: Add the better-sqlite3-style adapter to the package
        run: |
          cp bindings/js/sqlite.js pkg/sqlite.js
          cp bindings/js/browser.js pkg/browser.js
          cp bindings/js/worker.js pkg/worker.js
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('pkg/package.json'));p.files=Array.from(new Set([...(p.files||[]),'sqlite.js','browser.js','worker.js']));p.exports={'.':'./'+(p.module||'picovolt.js'),'./sqlite':'./sqlite.js','./browser':'./browser.js','./worker':'./worker.js'};fs.writeFileSync('pkg/package.json',JSON.stringify(p,null,2));"
      - name: Publish to npm with provenance
        working-directory: pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  registry-smoke:
    name: clean install (Cargo + npm)
    needs: [publish-crate, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the published Cargo package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            cargo install picovolt --version "$ver" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          pv --help
      - name: Install and query the published npm package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir npm-smoke
          cd npm-smoke
          npm init -y
          for attempt in 1 2 3 4 5; do
            npm install "picovolt@$ver" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          node --experimental-wasm-modules --input-type=module -e \
            'import Database from "picovolt/sqlite"; const db = new Database(); db.exec("CREATE TABLE smoke (id)"); const tx=db.transaction(()=>db.exec("INSERT INTO smoke VALUES (1)")); tx(); try { db.transaction(()=>{db.exec("INSERT INTO smoke VALUES (2)"); throw new Error("rollback")})(); } catch {} if (db.prepare("SELECT COUNT(*) AS n FROM smoke").get().n !== 1) process.exit(1);'

  # 4. Build native CLI/server downloads, a CycloneDX SBOM, and attest their
  # provenance. Every target is built on its native GitHub-hosted runner.
  build-binaries:
    name: binaries (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            ext: ""
          - os: macos-latest
            label: macos-arm64
            ext: ""
          - os: windows-latest
            label: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-cyclonedx
      - name: Build CLI and server
        shell: bash
        run: |
          cargo build --release --features server --bin pv --bin picovolt-server
          "target/release/pv${{ matrix.ext }}" --help
          mkdir -p dist
          cp "target/release/pv${{ matrix.ext }}" "dist/pv-${{ matrix.label }}${{ matrix.ext }}"
          cp "target/release/picovolt-server${{ matrix.ext }}" "dist/picovolt-server-${{ matrix.label }}${{ matrix.ext }}"
          # cargo-cyclonedx appends the selected format extension even when the
          # filename is overridden, so omit the trailing `.json` here.
          cargo cyclonedx --format json --override-filename "picovolt-${{ matrix.label }}.cdx"
          test -f "picovolt-${{ matrix.label }}.cdx.json"
          mv "picovolt-${{ matrix.label }}.cdx.json" dist/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # 5. Cut the GitHub Release with notes and all native artifacts.
  github-release:
    name: github release
    needs: [verify, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true
      - name: Extract changelog section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          start="## [${ver}]"
          # index()-based prefix match: a dynamic regex with \[ is mis-parsed by
          # gawk as a character class, so avoid regex for the version header.
          awk -v start="$start" '
            index($0, start)==1 {flag=1; next}
            flag && index($0, "## [")==1 {exit}
            flag && /^\[.*\]:/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section for $ver; will auto-generate notes."
          fi
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "PicoVolt $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "PicoVolt $GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
