name: PV-2.3 implementation workbench

on:
  push:
    branches: [codex/2.3-persistent-retrieval-m001]
    paths:
      - .github/workflows/pv23-workbench.yml
      - scripts/pv23-reviewed-*.part

permissions:
  contents: write

concurrency:
  group: pv23-implementation-workbench
  cancel-in-progress: false

jobs:
  apply-reviewed-candidate:
    if: github.repository == 'MiniJe/picovolt' && github.ref == 'refs/heads/codex/2.3-persistent-retrieval-m001'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Verify and apply the exact locally reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import gzip, hashlib, os, pathlib, subprocess
          parts = [pathlib.Path(f'scripts/pv23-reviewed-{i}.part').read_bytes() for i in range(9)]
          assert all(len(part) == 2215 for part in parts), 'Unexpected patch transport length'
          payload = b''.join(parts)
          expected_git_blob = '151f082f09931f88f8baa3c0c083bd2a55f90ae1'
          assert hashlib.sha1(f'blob {len(payload)}\0'.encode() + payload).hexdigest() == expected_git_blob
          patch = gzip.decompress(payload)
          assert len(patch) == 57638
          assert hashlib.sha256(patch).hexdigest() == '64fc6af3c51a34c72df22697430bdc59e2fe3967cd1306e97faf9eb12ce0090e'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pv23-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          expected = set(['.github/workflows/persistent-retrieval.yml', '.github/workflows/release.yml', 'CHANGELOG.md', 'Cargo.lock', 'Cargo.toml', 'NOTICE', 'README.md', 'ROADMAP.md', 'SECURITY.md', 'bindings/go/NOTICE', 'bindings/go/include/picovolt.h', 'bindings/go/persistent_retrieval_test.go', 'bindings/js/tests/persistent-retrieval.integration.mjs', 'bindings/python/NOTICE', 'bindings/python/picovolt/__init__.py', 'bindings/python/pyproject.toml', 'bindings/python/test_persistent_retrieval.py', 'bindings/python/test_retrieval.py', 'bindings/python/test_vault.py', 'docs/CONCURRENCY.md', 'docs/FORMAT.md', 'docs/PERSISTENT_RETRIEVAL_2_3.md', 'docs/RELEASE_2_3.md', 'include/picovolt.h', 'legal/COMPONENT-SCOPE-2.3.md', 'legal/PUBLIC-RELEASE.json', 'starters/browser/package-lock.json', 'starters/browser/package.json', 'starters/go/go.mod', 'starters/go/go.sum', 'starters/node/package-lock.json', 'starters/node/package.json', 'starters/python/requirements.txt', 'starters/rust-cli/Cargo.toml', 'tests/persistent_retrieval_interfaces.rs'])
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == expected, (changed - expected, expected - changed)
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          assert hashlib.sha256(pathlib.Path('LICENSE').read_bytes()).hexdigest() == 'fea338d875dfc9e115342e6d802742126b57ba1c5ebef7a54cde9cf26c1984ff'
          PYCODE
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b
        with:
          tool: wasm-pack@0.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build candidate npm archive without publishing
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_npm_package.sh pkg
          (cd pkg && npm pack --json > npm-pack.json)
          python3 - <<'PYCODE'
          import json, pathlib
          package = json.loads(pathlib.Path('pkg/npm-pack.json').read_text())[0]
          assert package['version'] == '2.3.0'
          integrity = package['integrity']
          assert integrity.startswith('sha512-')
          for name in ('node', 'browser'):
              path = pathlib.Path('starters') / name / 'package-lock.json'
              data = json.loads(path.read_text())
              entry = data['packages']['node_modules/picovolt']
              assert entry['version'] == '2.3.0'
              assert entry['integrity'] == 'PV23_PENDING_MEASURED_NPM_INTEGRITY'
              entry['integrity'] = integrity
              path.write_text(json.dumps(data, indent=2) + '\n')
          print('Measured candidate npm archive integrity:', integrity)
          PYCODE
          git add starters/node/package-lock.json starters/browser/package-lock.json
      - name: Validate prepared source and policy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_registry_starters.py policy
          python3 scripts/check_public_release.py
          git diff --cached --check
      - name: Commit only to the authorized implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/codex/2.3-persistent-retrieval-m001
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'Simon Paul'
          git config user.email '80901645+MiniJe@users.noreply.github.com'
          git commit -s -m 'chore(release): prepare verified PicoVolt 2.3 candidate and interface qualification' -m 'Apply the hash-verified locally reviewed patch; add explicit C/Python/Go/JS and encrypted-snapshot coverage, exact format and semantics documentation, unchanged-term component scope, and measured npm/source-derived Go starter checksums. No merge, tag, registry publication or deployment.'
          git push origin HEAD:refs/heads/codex/2.3-persistent-retrieval-m001
      - name: Export candidate evidence without credentials or repository metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pv23-candidate"
          git rev-parse HEAD > "$RUNNER_TEMP/pv23-candidate/source-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pv23-candidate/source.tar.gz"
          cp pkg/npm-pack.json "$RUNNER_TEMP/pv23-candidate/npm-pack.json"
          rustc -Vv > "$RUNNER_TEMP/pv23-candidate/toolchain.txt"
          cd "$RUNNER_TEMP/pv23-candidate"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pv23-prepared-candidate
          path: ${{ runner.temp }}/pv23-candidate/
          retention-days: 7
          if-no-files-found: error
