name: PV-2.3 implementation workbench

on:
  push:
    branches: [codex/2.3-persistent-retrieval-m001]
    paths:
      - .github/workflows/pv23-workbench.yml

permissions:
  contents: read

concurrency:
  group: pv23-implementation-workbench
  cancel-in-progress: false

jobs:
  source-export:
    if: github.repository == 'MiniJe/picovolt' && github.ref == 'refs/heads/codex/2.3-persistent-retrieval-m001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Export only tracked implementation source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pv23-source"
          git rev-parse HEAD > "$RUNNER_TEMP/pv23-source/source-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pv23-source/source.tar.gz"
          cd "$RUNNER_TEMP/pv23-source"
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pv23-continuation-source
          path: ${{ runner.temp }}/pv23-source/
          retention-days: 2
          if-no-files-found: error
