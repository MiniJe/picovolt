name: Python wheels

# Builds platform wheels for the ctypes binding (each bundles the compiled C ABI
# shared library) and, on a version tag, publishes them to PyPI with a short-lived
# OpenID Connect credential. Configure the `pypi` trusted-publisher environment
# once at https://pypi.org/manage/account/publishing/.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Tag matches Python package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os,pathlib; actual=next(line.split()[2].strip(chr(34)) for line in pathlib.Path('pyproject.toml').read_text().splitlines() if line.startswith('version = ')); expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'Python version {actual} != tag {expected}'"

      - name: Build the C ABI shared library
        working-directory: .
        run: cargo build --release --features capi

      - name: Bundle the library into the package
        shell: bash
        run: |
          mkdir -p picovolt
          if [ -f ../../target/release/libpicovolt.so ]; then cp ../../target/release/libpicovolt.so picovolt/; fi
          if [ -f ../../target/release/libpicovolt.dylib ]; then cp ../../target/release/libpicovolt.dylib picovolt/; fi
          if [ -f ../../target/release/picovolt.dll ]; then cp ../../target/release/picovolt.dll picovolt/; fi

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Smoke test the wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          mkdir -p ../../target/python-wheel-smoke
          cd ../../target/python-wheel-smoke
          python - <<'PY'
          from picovolt import Database, __version__, version
          db = Database.open_memory()
          db.query("CREATE TABLE t (x)")
          db.query("INSERT INTO t VALUES (1)")
          assert db.query("SELECT * FROM t")["rows"] == [[1]]
          assert __version__ == version()
          print("wheel ok:", version())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  linux-wheel:
    name: wheel (manylinux x86-64)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0536c364004fa2a3c5041120b6fe35d84fc5bfe31f04c6a6304f13eac4a67b63
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Tag matches Python package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          /opt/python/cp39-cp39/bin/python -c "import os,pathlib; actual=next(line.split()[2].strip(chr(34)) for line in pathlib.Path('pyproject.toml').read_text().splitlines() if line.startswith('version = ')); expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'Python version {actual} != tag {expected}'"

      - name: Build the C ABI shared library
        working-directory: .
        run: cargo build --release --features capi

      - name: Bundle the library and build a portable wheel
        run: |
          cp ../../target/release/libpicovolt.so picovolt/
          /opt/python/cp39-cp39/bin/python -m build --wheel
          auditwheel repair --plat manylinux_2_28_x86_64 \
            --wheel-dir wheelhouse dist/*.whl

      - name: Smoke test the wheel on minimum Python
        run: |
          /opt/python/cp39-cp39/bin/python -m pip install --force-reinstall wheelhouse/*.whl
          mkdir -p ../../target/python-wheel-smoke-linux
          cd ../../target/python-wheel-smoke-linux
          /opt/python/cp39-cp39/bin/python - <<'PY'
          from picovolt import Database, __version__, version
          db = Database.open_memory()
          db.query("CREATE TABLE t (x)")
          db.query("INSERT INTO t VALUES (1)")
          assert db.query("SELECT * FROM t")["rows"] == [[1]]
          assert __version__ == version()
          print("manylinux wheel ok:", version())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-manylinux-x86-64
          path: bindings/python/wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [wheels, linux-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  smoke:
    name: clean install (PyPI)
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Install and query the published wheel
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            python -m pip install "picovolt==$ver" && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 15
          done
          python - <<'PY'
          from picovolt import Database
          db = Database.open_memory()
          db.query("CREATE TABLE smoke (id)")
          db.query("INSERT INTO smoke VALUES (1)")
          assert db.query("SELECT * FROM smoke")["rows"] == [[1]]
          PY
