name: Python wheels

# Builds platform wheels for the ctypes binding (each bundles the compiled C ABI
# shared library) and, on a version tag, publishes them to PyPI with a short-lived
# OpenID Connect credential. Configure the `pypi` trusted-publisher environment
# once at https://pypi.org/manage/account/publishing/.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  starter-policy:
    name: registry-only starter policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test and enforce the policy
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/check_registry_starters.py policy

  wheels:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Tag matches Python package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os,pathlib; actual=next(line.split()[2].strip(chr(34)) for line in pathlib.Path('pyproject.toml').read_text().splitlines() if line.startswith('version = ')); expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'Python version {actual} != tag {expected}'"

      - name: Build the Windows C ABI shared library
        if: runner.os == 'Windows'
        working-directory: .
        run: cargo build --locked --release --features capi

      - name: Build a real universal2 macOS C ABI shared library
        if: runner.os == 'macOS'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --features capi --target aarch64-apple-darwin
          cargo build --locked --release --features capi --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/libpicovolt.dylib \
            target/x86_64-apple-darwin/release/libpicovolt.dylib \
            -output target/release/libpicovolt.dylib
          lipo target/release/libpicovolt.dylib -verify_arch arm64 x86_64
          lipo target/release/libpicovolt.dylib -info

      - name: Bundle the library into the package
        shell: bash
        run: |
          mkdir -p picovolt
          if [ -f ../../target/release/libpicovolt.so ]; then cp ../../target/release/libpicovolt.so picovolt/; fi
          if [ -f ../../target/release/libpicovolt.dylib ]; then cp ../../target/release/libpicovolt.dylib picovolt/; fi
          if [ -f ../../target/release/picovolt.dll ]; then cp ../../target/release/picovolt.dll picovolt/; fi

      - name: Build the wheel
        env:
          PICOVOLT_WHEEL_PLATFORM: ${{ runner.os == 'macOS' && 'macosx_10_9_universal2' || '' }}
        run: |
          python -m pip install "pip==26.2.1" "build==1.6.0"
          python -m build --wheel

      - name: Smoke test the wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          mkdir -p ../../target/python-wheel-smoke
          cd ../../target/python-wheel-smoke
          python - <<'PY'
          from picovolt import Database, __version__, version
          db = Database.open_memory()
          db.query("CREATE TABLE t (x)")
          db.begin()
          db.query("INSERT INTO t VALUES (1)")
          db.commit()
          db.begin()
          db.query("INSERT INTO t VALUES (2)")
          db.rollback()
          assert db.query("SELECT * FROM t")["rows"] == [[1]]
          assert __version__ == version()
          print("wheel ok:", version())
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  linux-wheel:
    name: wheel (manylinux x86-64)
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0536c364004fa2a3c5041120b6fe35d84fc5bfe31f04c6a6304f13eac4a67b63
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1

      - name: Tag matches Python package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          /opt/python/cp310-cp310/bin/python -c "import os,pathlib; actual=next(line.split()[2].strip(chr(34)) for line in pathlib.Path('pyproject.toml').read_text().splitlines() if line.startswith('version = ')); expected=os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert actual == expected, f'Python version {actual} != tag {expected}'"

      - name: Build the C ABI shared library
        working-directory: .
        run: cargo build --locked --release --features capi

      - name: Bundle the library and build a portable wheel
        run: |
          cp ../../target/release/libpicovolt.so picovolt/
          /opt/python/cp310-cp310/bin/python -m pip install \
            "pip==26.2.1" "build==1.6.0"
          /opt/python/cp310-cp310/bin/python -m build --wheel
          auditwheel repair --plat manylinux_2_28_x86_64 \
            --wheel-dir wheelhouse dist/*.whl

      - name: Smoke test the wheel on minimum Python
        run: |
          /opt/python/cp39-cp39/bin/python -m pip install --force-reinstall wheelhouse/*.whl
          mkdir -p ../../target/python-wheel-smoke-linux
          cd ../../target/python-wheel-smoke-linux
          /opt/python/cp39-cp39/bin/python - <<'PY'
          from picovolt import Database, __version__, version
          db = Database.open_memory()
          db.query("CREATE TABLE t (x)")
          db.begin()
          db.query("INSERT INTO t VALUES (1)")
          db.commit()
          db.begin()
          db.query("INSERT INTO t VALUES (2)")
          db.rollback()
          assert db.query("SELECT * FROM t")["rows"] == [[1]]
          assert __version__ == version()
          print("manylinux wheel ok:", version())
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-manylinux-x86-64
          path: bindings/python/wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [starter-policy, wheels, linux-wheel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # The Go wrapper links against the native C ABI shipped in the Python wheel.
  # Publish its subdirectory tag only after that matching wheel is public, so a
  # Go version can never lead users to a native artifact that does not exist.
  publish-go-module:
    name: publish Go module tag
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Publish the bindings/go submodule tag
        shell: bash
        run: |
          set -euo pipefail
          module_tag="bindings/go/$GITHUB_REF_NAME"

          verify_remote_tag() {
            git fetch --force origin \
              "+refs/tags/$module_tag:refs/tags/$module_tag"
            actual="$(git rev-parse "$module_tag^{commit}")"
            if [ "$actual" != "$GITHUB_SHA" ]; then
              echo "::error::$module_tag points to $actual, expected $GITHUB_SHA"
              exit 1
            fi
            echo "$module_tag publishes $GITHUB_SHA"
          }

          if git ls-remote --exit-code --refs origin \
            "refs/tags/$module_tag" >/dev/null 2>&1; then
            verify_remote_tag
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$module_tag" \
            -m "PicoVolt Go bindings $GITHUB_REF_NAME" "$GITHUB_SHA"
          if git push origin "refs/tags/$module_tag"; then
            echo "$module_tag published"
            exit 0
          fi

          # A concurrent rerun may have won the push race. Accept it only when
          # the immutable remote tag resolves to this exact release commit.
          echo "tag push raced with another run; validating the remote tag"
          verify_remote_tag

  smoke:
    name: registry starters (PyPI + Go proxy)
    needs: publish-go-module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Allow the new tag to reach the public Go proxy
        shell: bash
        run: sleep 60
      - name: Copy, install, and run the published starters
        run: >-
          python scripts/check_registry_starters.py run
          --version "${GITHUB_REF_NAME#v}"
          --starter python --starter go
