name: Cut PicoVolt 2.3.0 tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cut-v2.3.0.yml

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'MiniJe/picovolt' && github.event.before == 'fdcd217e1826e2c945767a2989c3691005fa4877'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify and create immutable annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.before }}"
          test "$target" = "fdcd217e1826e2c945767a2989c3691005fa4877"
          git show "$target:Cargo.toml" | grep -q '^version = "2.3.0"$'
          git show "$target:legal/PUBLIC-RELEASE.json" > "$RUNNER_TEMP/public-release.json"
          jq -e '.version == "2.3.0" and .publication_status == "authorized-for-publication"' "$RUNNER_TEMP/public-release.json" >/dev/null

          if git ls-remote --exit-code --refs origin refs/tags/v2.3.0 >/dev/null 2>&1; then
            git fetch --force origin +refs/tags/v2.3.0:refs/tags/v2.3.0
            actual="$(git rev-parse v2.3.0^{commit})"
            test "$actual" = "$target"
            echo "v2.3.0 already points to $target"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v2.3.0 "$target" -m "PicoVolt 2.3.0 — Persistent Retrieval"
          git push origin refs/tags/v2.3.0
          echo "v2.3.0 -> $target"
