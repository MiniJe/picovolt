name: Cancel stale PicoVolt 2.3 release retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-v2.3-release.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.repository == 'MiniJe/picovolt'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stale=35731458492
          status="$(gh run view "$stale" --repo "$GITHUB_REPOSITORY" --json status -q .status || true)"
          case "$status" in
            queued|in_progress|pending|waiting|requested)
              gh run cancel "$stale" --repo "$GITHUB_REPOSITORY"
              echo "Cancelled superseded release run $stale ($status)."
              ;;
            *)
              echo "Run $stale no longer cancellable ($status); nothing to do."
              ;;
          esac
