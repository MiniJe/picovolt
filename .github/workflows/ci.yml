name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: minimum Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.86.0
      - run: cargo check --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (capi)
        run: cargo clippy --all-targets --features capi -- -D warnings
      - name: Clippy + test (enterprise integration)
        run: |
          cargo clippy --all-targets --features enterprise -- -D warnings
          cargo test --all-targets --features enterprise
      - name: Test
        run: cargo test --all-targets
      - name: Test (capi)
        run: cargo test --all-targets --features capi
      - name: Server build + clippy
        run: |
          cargo clippy --features server --bin picovolt-server -- -D warnings
          cargo build --features server --bin picovolt-server
      - name: Doc tests
        run: cargo test --doc

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  starter-policy:
    name: registry-only starter policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Test the policy checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Reject checkout-local starter dependencies
        run: python scripts/check_registry_starters.py policy

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit

  wasm:
    name: wasm32 + js bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build wasm32 with JS bindings
        run: cargo build --target wasm32-unknown-unknown --features wasm
      - name: Test prepared statements through the published JS surfaces
        run: |
          wasm-pack build --target bundler --dev --out-dir pkg -- --features wasm
          cp bindings/js/sqlite.js pkg/sqlite.js
          cp bindings/js/browser.js pkg/browser.js
          cp bindings/js/worker.js pkg/worker.js
          node --experimental-wasm-modules --test bindings/js/tests/prepared.integration.mjs

  fuzz-build:
    name: fuzz-build (nightly)
    runs-on: ubuntu-latest
    # cargo-fuzz sets its own RUSTFLAGS; don't inherit `-D warnings`.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets (compile check)
        # Pin the host target: cargo-fuzz otherwise defaults to musl, whose std
        # isn't installed on the runner (E0463: can't find crate for `core`).
        run: cargo fuzz build --sanitizer none --target x86_64-unknown-linux-gnu

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by line (use 'git commit -s')"
              fail=1
            fi
          done
          exit $fail
