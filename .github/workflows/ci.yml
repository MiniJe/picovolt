name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: minimum Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.86.0
      - run: cargo check --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (capi)
        run: cargo clippy --all-targets --features capi -- -D warnings
      - name: Clippy + test (enterprise integration)
        run: |
          cargo clippy --all-targets --features enterprise -- -D warnings
          cargo test --all-targets --features enterprise
      - name: Test
        run: cargo test --all-targets
      - name: Test (capi)
        run: cargo test --all-targets --features capi
      - name: Server build + clippy
        run: |
          cargo clippy --features server --bin picovolt-server -- -D warnings
          cargo build --features server --bin picovolt-server
      - name: Doc tests
        run: cargo test --doc
      - name: API documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  starter-policy:
    name: registry-only starter policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test the policy checker
        run: python -m unittest discover -s scripts/tests -v
      - name: Reject checkout-local starter dependencies
        run: python scripts/check_registry_starters.py policy

  go:
    name: go binding (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build native C ABI
        run: cargo build --features capi
      - name: Test and vet the Go binding
        working-directory: bindings/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: |
          go test ./...
          go vet ./...

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit
      - run: cargo generate-lockfile
      - run: cargo audit

  wasm:
    name: wasm32 + js bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build wasm32 with JS bindings
        run: cargo build --target wasm32-unknown-unknown --features wasm
      - name: Test prepared statements through the published JS surfaces
        run: |
          wasm-pack build --target bundler --dev --out-dir pkg -- --features wasm
          cp bindings/js/sqlite.js pkg/sqlite.js
          cp bindings/js/browser.js pkg/browser.js
          cp bindings/js/worker.js pkg/worker.js
          node --experimental-wasm-modules --test bindings/js/tests/prepared.integration.mjs

  fuzz-build:
    name: fuzz-build (nightly)
    runs-on: ubuntu-latest
    # cargo-fuzz sets its own RUSTFLAGS; don't inherit `-D warnings`.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets (compile check)
        # Pin the host target: cargo-fuzz otherwise defaults to musl, whose std
        # isn't installed on the runner (E0463: can't find crate for `core`).
        run: cargo fuzz build --sanitizer none --target x86_64-unknown-linux-gnu

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by line (use 'git commit -s')"
              fail=1
            fi
          done
          exit $fail
