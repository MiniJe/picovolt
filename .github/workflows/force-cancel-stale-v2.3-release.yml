name: Force-cancel stale PicoVolt 2.3 release retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/force-cancel-stale-v2.3-release.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.repository == 'MiniJe/picovolt'
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel superseded recovery run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stale=35731458492
          status="$(gh run view "$stale" --repo "$GITHUB_REPOSITORY" --json status -q .status || true)"
          case "$status" in
            queued|in_progress|pending|waiting|requested)
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$stale/force-cancel"
              echo "Force-cancel requested for superseded release run $stale ($status)."
              ;;
            *)
              echo "Run $stale is already terminal ($status); nothing to do."
              ;;
          esac
