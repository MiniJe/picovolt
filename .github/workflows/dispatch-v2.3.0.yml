name: Resume PicoVolt 2.3.0 publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v2.3.0.yml

permissions:
  actions: write
  contents: read

jobs:
  resume:
    if: github.repository == 'MiniJe/picovolt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin +refs/tags/v2.3.0:refs/tags/v2.3.0
          target="$(git rev-parse 'v2.3.0^{commit}')"
          expected="089090bab62e47d5fde046d608094ebc7e8532dd"
          if [ "$target" != "$expected" ]; then
            echo "::error::v2.3.0 points to $target, expected $expected"
            exit 1
          fi
          echo "v2.3.0 immutable target verified: $target"
      - name: Resume idempotent release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field tag=v2.3.0
          echo "Release recovery dispatched for immutable v2.3.0."
