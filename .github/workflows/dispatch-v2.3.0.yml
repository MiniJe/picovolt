name: Halt PicoVolt 2.3.0 Python publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v2.3.0.yml

permissions:
  actions: write
  contents: read

jobs:
  halt:
    if: github.repository == 'MiniJe/picovolt'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the in-flight Python publication before registry upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 35645219470 --repo "$GITHUB_REPOSITORY" || true
          echo "Requested cancellation of Python wheels run 35645219470"
