version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # wat 1.259.0 raises the transitive wasm toolchain MSRV to Rust 1.88.
      # PicoVolt remains qualified against Rust 1.86 until an intentional MSRV bump.
      - dependency-name: wat
        versions: [">=1.259.0"]
      # Arrow 60 raises the arrow-rs MSRV to Rust 1.88.
      # Keep data-tools on Arrow 59 while PicoVolt qualifies Rust 1.86.
      - dependency-name: arrow-array
        versions: [">=60.0.0"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/starters/browser"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # This exact version is advanced with the rest of the release manifests.
      - dependency-name: picovolt
    groups:
      browser-tooling:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/bindings/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      python-build-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
